# JVM settings for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build performance.
org.gradle.parallel=true
org.gradle.caching=true
# The configuration cache works with this stack but is left off so that a first
# sync on a fresh machine stays predictable. Enable it once the build is stable.
# org.gradle.configuration-cache=true

# AndroidX and Kotlin defaults.
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
