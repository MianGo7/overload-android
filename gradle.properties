# JVM settings for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build performance.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.tooling.parallel=true
# The configuration cache is not enabled yet, see backlog item B11.
# org.gradle.configuration-cache=true

# AndroidX and Kotlin defaults.
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Recommended by AGP for dependency resolution performance.
android.dependency.useConstraints=true
android.dependency.excludeLibraryComponentsFromConstraints=true

# Two compatibility flags are left over from the move to AGP 9. Both keep the
# old AGP 8 behaviour and both disappear in AGP 10, so removing them is a
# migration of its own, tracked as backlog item B11.
#   builtInKotlin  keeps the separate Kotlin Gradle plugin instead of the
#                  Kotlin support that is built into AGP 9.
#   newDsl         keeps the legacy variant API available, which something in
#                  the build still calls.
android.builtInKotlin=false
android.newDsl=false
