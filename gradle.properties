# JVM settings for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build performance.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.tooling.parallel=true
org.gradle.configuration-cache=true

# AndroidX and Kotlin defaults.
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Dependency resolution performance. excludeLibraryComponentsFromConstraints
# is gone in AGP 10, useConstraints=false is AGP's own suggested replacement
# for the same effect.
android.dependency.useConstraints=false
